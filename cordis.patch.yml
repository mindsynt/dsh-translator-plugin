- insert:
    - id: model-translator
      name: '@local/model-translator'
      config:
        provider: auto
        model: auto
        targetLanguage: auto
        translateOutput: true
        translateThinking: true
        translateMode: block
        # Offline engine (CTranslate2 + Opus-MT). The en-zh model ships
        # bundled with the plugin so a fresh install translates offline
        # without a download. Turn offlineAutoDownload on to fetch other
        # language pairs from the public gaudi ctranslate2 conversion on
        # HuggingFace. 'offlinePair: auto' infers the pair from each block's
        # detected language, which is what most users want.
        offlinePair: auto
        offlineAutoDownload: false
